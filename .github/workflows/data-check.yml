# Daily check of hand-maintained data (stadiums, team maps, season, assets)
# against ESPN, plus a smoke test of the live API routes. Free on public repos.
# Results: GitHub issues labelled `data-check` + a Resend email when anything changes.
name: Data check

on:
  schedule:
    - cron: '0 13 * * *' # daily, 13:00 UTC (8–9am US Eastern)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Findings are reported via issues, so a failing check must not stop the sync step.
      - name: Run data check
        run: pnpm check:data --json=data-check-report.json || true
        env:
          SITE_URL: https://mlsfire.net

      - name: Sync issues and email
        run: pnpm exec tsx scripts/data-check/notify.mts data-check-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
